<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>하나둘 · Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0e0c; --surface:#1a1814; --card:#221f1a; --border:rgba(255,255,255,0.07);
    --accent:#e8a040; --accent2:#c85a2a; --text:#f0ebe0; --muted:#7a7060;
    --soft:#3a3528; --hanja:#d4883a; --correct:#4a9a6a; --wrong:#c84040;
    --card-kr:#2a2520; --card-en:#1e2a1e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Lato',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(232,160,64,0.06) 0%,transparent 60%),
               radial-gradient(ellipse 60% 40% at 80% 90%,rgba(200,90,42,0.05) 0%,transparent 60%)}

  /* ── HEADER ── */
  header{position:sticky;top:0;z-index:100;background:rgba(15,14,12,0.95);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
  .header-left{display:flex;align-items:center;gap:12px}
  .back-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
    color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;
    text-decoration:none;transition:all 0.15s}
  .back-btn:active{border-color:var(--accent);color:var(--accent)}
  .logo{display:flex;flex-direction:column;gap:1px}
  .logo-kr{font-family:'Noto Serif KR',serif;font-size:1.1rem;font-weight:900;color:var(--accent);letter-spacing:0.05em;line-height:1}
  .logo-en{font-size:0.58rem;color:var(--muted);font-weight:300;letter-spacing:0.2em;text-transform:uppercase}
  .score-badge{display:flex;align-items:center;gap:5px;background:rgba(232,160,64,0.12);
    border:1px solid rgba(232,160,64,0.2);border-radius:20px;padding:5px 12px;font-size:0.78rem;color:var(--accent);font-weight:700}

  /* ── MAIN ── */
  main{padding:20px 16px 80px;max-width:500px;margin:0 auto;position:relative;z-index:1}

  /* ── LEVEL SELECTOR ── */
  .level-section{margin-bottom:20px}
  .level-label{font-size:0.68rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .level-tabs{display:flex;gap:8px;flex-wrap:wrap}
  .level-tab{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);font-size:0.78rem;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Lato',sans-serif}
  .level-tab.active{background:rgba(232,160,64,0.15);border-color:rgba(232,160,64,0.4);color:var(--accent)}
  .level-tab.locked{opacity:0.35;cursor:default}
  .level-tab:not(.locked):active{background:rgba(232,160,64,0.2)}

  /* ── GAME INFO BAR ── */
  .game-info{display:flex;gap:10px;margin-bottom:16px}
  .info-pill{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;text-align:center}
  .info-num{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--accent);line-height:1}
  .info-label{font-size:0.62rem;color:var(--muted);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-top:3px}

  /* ── GRID ── */
  .game-grid{display:grid;gap:10px;margin-bottom:20px}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}

  /* ── CARD ── */
  .mem-card{aspect-ratio:3/4;perspective:600px;cursor:pointer}
  .mem-card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.4s cubic-bezier(0.4,0,0.2,1)}
  .mem-card.flipped .mem-card-inner{transform:rotateY(180deg)}
  .mem-card.matched .mem-card-inner{transform:rotateY(180deg)}

  .mem-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;border:1px solid var(--border)}

  /* BACK face */
  .mem-back{background:var(--card);border-color:var(--border)}
  .mem-back-pattern{font-size:1.8rem;opacity:0.15;user-select:none}
  .mem-back-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0.3;margin-top:6px}

  /* FRONT - Korean */
  .mem-front-kr{background:var(--card-kr);border-color:rgba(212,136,58,0.2);transform:rotateY(180deg)}
  .mem-front-kr .card-type{font-size:0.55rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;
    color:var(--hanja);opacity:0.7;margin-bottom:6px}
  .mem-front-kr .card-word{font-family:'Noto Serif KR',serif;font-size:1.3rem;font-weight:900;color:var(--text);
    text-align:center;line-height:1.2}
  .mem-front-kr .card-roman{font-size:0.6rem;color:var(--muted);font-style:italic;margin-top:4px;font-family:'Playfair Display',serif}

  /* FRONT - English */
  .mem-front-en{background:var(--card-en);border-color:rgba(74,154,106,0.2);transform:rotateY(180deg)}
  .mem-front-en .card-type{font-size:0.55rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;
    color:var(--correct);opacity:0.7;margin-bottom:6px}
  .mem-front-en .card-word{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--text);
    text-align:center;line-height:1.3}

  /* MATCHED state */
  .mem-card.matched .mem-face{border-color:rgba(74,154,106,0.4);background:rgba(74,154,106,0.08)}
  .mem-card.matched .mem-front-kr .card-word,
  .mem-card.matched .mem-front-en .card-word{color:var(--correct)}

  /* WRONG flash */
  .mem-card.wrong .mem-card-inner{animation:wrongShake 0.4s ease}
  @keyframes wrongShake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-4px)}75%{transform:rotateY(180deg) translateX(4px)}}

  /* ── RESULT SCREEN ── */
  .result-screen{display:none;text-align:center;padding:30px 20px;animation:fadeIn 0.4s ease}
  .result-screen.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .result-emoji{font-size:4rem;margin-bottom:12px}
  .result-title{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--accent);margin-bottom:6px}
  .result-sub{font-size:0.88rem;color:var(--muted);margin-bottom:24px;line-height:1.6}
  .result-stats{display:flex;gap:12px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
  .result-stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 20px;min-width:80px}
  .result-stat-num{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--accent);font-weight:700;line-height:1}
  .result-stat-label{font-size:0.62rem;color:var(--muted);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-top:4px}
  .btn-play{background:rgba(232,160,64,0.15);border:1px solid rgba(232,160,64,0.3);color:var(--accent);
    border-radius:14px;padding:14px 32px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;
    margin:0 6px;transition:all 0.15s}
  .btn-play:active{background:rgba(232,160,64,0.25)}
  .btn-next{background:rgba(74,154,106,0.15);border:1px solid rgba(74,154,106,0.3);color:var(--correct);
    border-radius:14px;padding:14px 32px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;
    margin:0 6px;transition:all 0.15s}
  .btn-next:active{background:rgba(74,154,106,0.25)}
  .btn-next.locked{opacity:0.35;cursor:default}

  /* ── BEST RECORD ── */
  .best-row{display:flex;align-items:center;justify-content:space-between;background:rgba(232,160,64,0.06);
    border:1px solid rgba(232,160,64,0.12);border-radius:12px;padding:10px 16px;margin-bottom:16px}
  .best-label{font-size:0.7rem;color:var(--muted);font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
  .best-val{font-size:0.85rem;color:var(--accent);font-weight:700}

  /* ── TOAST ── */
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);
    border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:0.85rem;color:var(--text);
    font-weight:700;z-index:999;transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);white-space:nowrap;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* ── PROGRESS ── */
  .match-progress{height:3px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .match-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width 0.4s ease}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="back-btn" href="index.html">←</a>
    <div class="logo">
      <div class="logo-kr">하나둘</div>
      <div class="logo-en">Memory Game</div>
    </div>
  </div>
  <div class="score-badge">⭐ <span id="totalScore">0</span></div>
</header>

<main>
  <!-- Level Selector -->
  <div class="level-section">
    <div class="level-label">🎮 Select Level</div>
    <div class="level-tabs" id="levelTabs"></div>
  </div>

  <!-- Best Record -->
  <div class="best-row">
    <span class="best-label">🏆 Best — Level <span id="bestLevel">1</span></span>
    <span class="best-val" id="bestRecord">—</span>
  </div>

  <!-- Game Info -->
  <div class="game-info">
    <div class="info-pill">
      <div class="info-num" id="movesCount">0</div>
      <div class="info-label">Moves</div>
    </div>
    <div class="info-pill">
      <div class="info-num" id="matchCount">0</div>
      <div class="info-label">Matched</div>
    </div>
    <div class="info-pill">
      <div class="info-num" id="timerCount">0</div>
      <div class="info-label">Seconds</div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="match-progress"><div class="match-progress-fill" id="matchProgress" style="width:0%"></div></div>

  <!-- Game Grid -->
  <div class="game-grid grid-4" id="gameGrid"></div>

  <!-- Result Screen -->
  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">Level Complete!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-stats">
      <div class="result-stat"><div class="result-stat-num" id="rMoves">0</div><div class="result-stat-label">Moves</div></div>
      <div class="result-stat"><div class="result-stat-num" id="rTime">0s</div><div class="result-stat-label">Time</div></div>
      <div class="result-stat"><div class="result-stat-num" id="rStars">⭐</div><div class="result-stat-label">Stars</div></div>
    </div>
    <div>
      <button class="btn-play" onclick="replayLevel()">↺ Replay</button>
      <button class="btn-next" id="btnNext" onclick="nextLevel()">Next Level →</button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
// ══════════════════════════════════════════
//  GAME_WORDS — data.js 의 STUDY_LIST 에서 자동 생성
// ══════════════════════════════════════════
function buildGameWords() {
  return STUDY_LIST
    .filter(key => WORDS[key])
    .map(key => ({
      korean: WORDS[key].korean,
      english: WORDS[key].english,
      romanization: WORDS[key].romanization
    }));
}

const LEVEL_CONFIG = [
  { level:1, pairs:4,  label:"Level 1",  desc:"4 pairs · Starter" },
  { level:2, pairs:6,  label:"Level 2",  desc:"6 pairs · Easy" },
  { level:3, pairs:8,  label:"Level 3",  desc:"8 pairs · Medium" },
  { level:4, pairs:10, label:"Level 4",  desc:"10 pairs · Hard" },
  { level:5, pairs:12, label:"Level 5",  desc:"12 pairs · Expert" }
];

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let currentLevel = 1;
let flippedCards = [];
let matchedPairs = 0;
let moves = 0;
let timer = 0;
let timerInterval = null;
let gameActive = false;
let canFlip = true;

function loadGameState() {
  try { return JSON.parse(localStorage.getItem('hanadul_game') || '{}'); }
  catch { return {}; }
}
function saveGameState(s) { localStorage.setItem('hanadul_game', JSON.stringify(s)); }

let gameState = loadGameState();

// ══════════════════════════════════════════
//  LEVEL TABS
// ══════════════════════════════════════════
function renderLevelTabs() {
  const container = document.getElementById('levelTabs');
  const maxUnlocked = gameState.maxLevel || 1;

  container.innerHTML = LEVEL_CONFIG.map(lv => {
    const unlocked = lv.level <= maxUnlocked;
    const active = lv.level === currentLevel ? 'active' : '';
    const locked = !unlocked ? 'locked' : '';
    const icon = !unlocked ? '🔒 ' : lv.level <= (gameState.maxLevel||1) && lv.level < currentLevel ? '✅ ' : '';
    return `<button class="level-tab ${active} ${locked}" onclick="${unlocked ? `selectLevel(${lv.level})` : 'showToast(\"Complete previous level first! 🔒\")'}">${icon}${lv.label}</button>`;
  }).join('');

  // Best record
  const best = gameState[`best_${currentLevel}`];
  const cfg = LEVEL_CONFIG[currentLevel-1];
  document.getElementById('bestLevel').textContent = currentLevel;
  document.getElementById('bestRecord').textContent = best ? `${best.moves} moves · ${best.time}s` : '—';
  document.getElementById('totalScore').textContent = gameState.totalScore || 0;
}

function selectLevel(lv) {
  currentLevel = lv;
  renderLevelTabs();
  startGame();
}

// ══════════════════════════════════════════
//  GAME
// ══════════════════════════════════════════
function startGame() {
  // Reset state
  flippedCards = [];
  matchedPairs = 0;
  moves = 0;
  canFlip = true;
  gameActive = false;
  stopTimer();
  timer = 0;

  document.getElementById('movesCount').textContent = '0';
  document.getElementById('matchCount').textContent = '0';
  document.getElementById('timerCount').textContent = '0';
  document.getElementById('matchProgress').style.width = '0%';
  document.getElementById('gameGrid').style.display = 'grid';
  document.getElementById('resultScreen').classList.remove('active');

  const cfg = LEVEL_CONFIG[currentLevel-1];
  // shuffle 후 slice — 중복 없이 정확히 cfg.pairs 개 단어 선택
  const words = shuffle([...GAME_WORDS]).slice(0, cfg.pairs);

  // 각 단어마다 kr 카드 1장 + en 카드 1장
  // id = 한국어 단어 문자열 (숫자 인덱스 사용 금지)
  const cards = [];
  words.forEach(w => {
    cards.push({ id: w.korean, type:'kr', korean:w.korean, english:w.english, romanization:w.romanization });
    cards.push({ id: w.korean, type:'en', korean:w.korean, english:w.english, romanization:w.romanization });
  });
  shuffle(cards);

  // 카드 수 검증 — 항상 짝수여야 함
  console.log(`Level ${currentLevel}: ${words.length} words, ${cards.length} cards`);

  const grid = document.getElementById('gameGrid');
  grid.className = 'game-grid grid-4';

  grid.innerHTML = cards.map((c, idx) => `
    <div class="mem-card" id="card-${idx}" data-id="${c.id}" data-type="${c.type}" onclick="flipCard(this)">
      <div class="mem-card-inner">
        <div class="mem-face mem-back">
          <div class="mem-back-pattern">韓</div>
          <div class="mem-back-dot"></div>
        </div>
        <div class="mem-face mem-front-${c.type}">
          <div class="card-type">${c.type === 'kr' ? '한국어' : 'English'}</div>
          ${c.type === 'kr'
            ? `<div class="card-word">${c.korean}</div><div class="card-roman">${c.romanization}</div>`
            : `<div class="card-word">${c.english}</div>`}
        </div>
      </div>
    </div>`).join('');
}

function flipCard(card) {
  if (!canFlip) return;
  if (card.classList.contains('flipped')) return;
  if (card.classList.contains('matched')) return;

  // Start timer on first flip
  if (!gameActive) {
    gameActive = true;
    startTimer();
  }

  card.classList.add('flipped');
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    canFlip = false;
    moves++;
    document.getElementById('movesCount').textContent = moves;
    checkMatch();
  }
}

function checkMatch() {
  const [a, b] = flippedCards;
  const match = a.dataset.id === b.dataset.id && a.dataset.type !== b.dataset.type;

  if (match) {
    a.classList.add('matched');
    b.classList.add('matched');
    matchedPairs++;
    document.getElementById('matchCount').textContent = matchedPairs;

    const cfg = LEVEL_CONFIG[currentLevel-1];
    const pct = Math.round(matchedPairs / cfg.pairs * 100);
    document.getElementById('matchProgress').style.width = pct + '%';

    // Speak the Korean word
    speakText(a.dataset.type === 'kr' ? a.querySelector('.card-word').textContent : b.querySelector('.card-word').textContent);

    flippedCards = [];
    canFlip = true;

    if (matchedPairs === cfg.pairs) {
      setTimeout(showResult, 500);
    }
  } else {
    a.classList.add('wrong');
    b.classList.add('wrong');
    setTimeout(() => {
      a.classList.remove('flipped','wrong');
      b.classList.remove('flipped','wrong');
      flippedCards = [];
      canFlip = true;
    }, 900);
  }
}

// ══════════════════════════════════════════
//  RESULT
// ══════════════════════════════════════════
function showResult() {
  stopTimer();
  gameActive = false;

  const cfg = LEVEL_CONFIG[currentLevel-1];
  const stars = calcStars(moves, cfg.pairs, timer);
  const starStr = '⭐'.repeat(stars) + '☆'.repeat(3-stars);

  // Save best
  const prev = gameState[`best_${currentLevel}`];
  const newBest = !prev || moves < prev.moves || (moves === prev.moves && timer < prev.time);
  if (newBest) {
    gameState[`best_${currentLevel}`] = { moves, time: timer };
  }

  // Unlock next level
  const maxUnlocked = gameState.maxLevel || 1;
  if (currentLevel >= maxUnlocked && currentLevel < LEVEL_CONFIG.length) {
    gameState.maxLevel = currentLevel + 1;
  }

  // Add score
  const score = stars * 10 + Math.max(0, 30 - moves) + Math.max(0, 60 - timer);
  gameState.totalScore = (gameState.totalScore || 0) + score;
  saveGameState(gameState);

  document.getElementById('gameGrid').style.display = 'none';
  document.getElementById('resultScreen').classList.add('active');
  document.getElementById('resultEmoji').textContent = stars === 3 ? '🌟' : stars === 2 ? '🎉' : '👍';
  document.getElementById('resultTitle').textContent = newBest ? '🏆 New Best!' : 'Level Complete!';
  document.getElementById('resultSub').textContent = `${cfg.desc} · +${score} points${newBest ? ' · New record!' : ''}`;
  document.getElementById('rMoves').textContent = moves;
  document.getElementById('rTime').textContent = timer + 's';
  document.getElementById('rStars').textContent = starStr;

  const btnNext = document.getElementById('btnNext');
  if (currentLevel < LEVEL_CONFIG.length) {
    btnNext.classList.remove('locked');
    btnNext.textContent = `Level ${currentLevel+1} →`;
  } else {
    btnNext.classList.add('locked');
    btnNext.textContent = '🏆 All Done!';
  }

  renderLevelTabs();
}

function calcStars(moves, pairs, time) {
  const perfect = pairs + 2;
  const good = pairs * 2;
  if (moves <= perfect) return 3;
  if (moves <= good) return 2;
  return 1;
}

function replayLevel() {
  document.getElementById('gameGrid').style.display = 'grid';
  document.getElementById('resultScreen').classList.remove('active');
  startGame();
}

function nextLevel() {
  if (currentLevel >= LEVEL_CONFIG.length) return;
  currentLevel++;
  renderLevelTabs();
  startGame();
}

// ══════════════════════════════════════════
//  TIMER
// ══════════════════════════════════════════
function startTimer() {
  timerInterval = setInterval(() => {
    timer++;
    document.getElementById('timerCount').textContent = timer;
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

// ══════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
// data.js 에서 GAME_WORDS 동적 생성
GAME_WORDS = buildGameWords();
